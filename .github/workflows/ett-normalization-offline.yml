name: ETT normalization offline

on:
  push:
    branches:
      - "agent/ett-staging-normalizer-*"
      - "agent/ett-offline-plan-*"
    paths:
      - ".github/workflows/ett-normalization-offline.yml"
      - "customs-clear/backend/app/services/staging_ett_ingest.py"
      - "customs-clear/backend/app/services/staging_ett_normalization.py"
      - "customs-clear/backend/app/services/staging_ett_normalization_core.py"
      - "customs-clear/backend/app/services/staging_ett_offline_plan.py"
      - "customs-clear/backend/app/services/staging_nsi_ingest.py"
      - "customs-clear/backend/scripts/ett_offline_plan.py"
      - "customs-clear/backend/scripts/ETT_OFFLINE_PLAN.md"
      - "customs-clear/backend/scripts/staging_migrations/**"
      - "customs-clear/backend/tests/test_staging_ett_ingest.py"
      - "customs-clear/backend/tests/test_staging_ett_normalization.py"
      - "customs-clear/backend/tests/test_ett_offline_plan_runner.py"
      - "customs-clear/backend/tests/ett_offline_plan_postgresql_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ett-normalization-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-dependency-free:
    name: runner-dependency-free
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.7"

      - name: Run offline runner without site packages
        working-directory: customs-clear/backend
        run: |
          python -S -m unittest -v tests.test_ett_offline_plan_runner

  postgresql-plan-integration:
    name: postgresql-plan-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.7"

      - name: Start disposable local PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb tariff_staging

      - name: Execute generated SQL in caller-owned transactions
        working-directory: customs-clear/backend
        run: |
          python -S tests/ett_offline_plan_postgresql_probe.py

  normalization:
    name: normalization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: .github/workflows/ett-normalization-offline.yml

      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "SQLAlchemy==2.0.44" \
            "alembic==1.17.2" \
            "pytest==8.4.2"

      - name: Compile normalization boundary
        working-directory: customs-clear/backend
        run: |
          python -m py_compile \
            app/services/staging_ett_ingest.py \
            app/services/staging_ett_normalization.py \
            app/services/staging_ett_normalization_core.py \
            app/services/staging_ett_offline_plan.py \
            scripts/ett_offline_plan.py \
            scripts/staging_migrations/ett_normalization_results_v1.py \
            tests/test_staging_ett_ingest.py \
            tests/test_staging_ett_normalization.py \
            tests/test_ett_offline_plan_runner.py

      - name: Run raw and normalization contracts offline
        working-directory: customs-clear/backend
        run: |
          python -m pytest -q \
            tests/test_staging_ett_ingest.py \
            tests/test_staging_ett_normalization.py \
            tests/test_ett_offline_plan_runner.py
