name: ETT offline normalization tool

on:
  push:
    branches:
      - "agent/ett-offline-tool-main-v1"
    paths:
      - ".github/workflows/ett-normalization-offline.yml"
      - "customs-clear/backend/app/services/staging_ett_normalization_core.py"
      - "customs-clear/backend/app/services/staging_ett_offline_plan.py"
      - "customs-clear/backend/scripts/ett_offline_plan.py"
      - "customs-clear/backend/scripts/ETT_OFFLINE_PLAN.md"
      - "customs-clear/backend/tests/test_ett_offline_plan_runner.py"
      - "customs-clear/backend/tests/ett_offline_plan_postgresql_probe.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ett-normalization-offline.yml"
      - "customs-clear/backend/app/services/staging_ett_normalization_core.py"
      - "customs-clear/backend/app/services/staging_ett_offline_plan.py"
      - "customs-clear/backend/scripts/ett_offline_plan.py"
      - "customs-clear/backend/scripts/ETT_OFFLINE_PLAN.md"
      - "customs-clear/backend/tests/test_ett_offline_plan_runner.py"
      - "customs-clear/backend/tests/ett_offline_plan_postgresql_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ett-offline-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-dependency-free:
    name: runner-dependency-free
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.7"

      - name: Run offline runner without site packages
        working-directory: customs-clear/backend
        run: python -S -m unittest -v tests.test_ett_offline_plan_runner

  postgresql-plan-integration:
    name: postgresql-plan-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.7"

      - name: Start disposable PostgreSQL database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb tariff_staging

      - name: Execute isolated PostgreSQL probe
        working-directory: customs-clear/backend
        run: python -S tests/ett_offline_plan_postgresql_probe.py
