name: Tariff AI — offline safety tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ai_team/**'
      - '.github/workflows/tariff-ai-*.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Standard-library tests; no provider keys or API calls
        run: python3 -I -m unittest discover -s tools/ai_team -p 'test_*.py' -v
