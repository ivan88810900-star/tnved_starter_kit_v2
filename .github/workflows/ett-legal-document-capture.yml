name: ETT observed legal document capture

on:
  push:
    branches: [ops/ett-legal-document-capture]

permissions:
  contents: read

concurrency:
  group: ett-legal-document-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  document-capture:
    runs-on: ubuntu-latest
    # Includes both bounded 20-minute chains, nine bounded probes and packaging.
    timeout-minutes: 75
    env:
      CUSTOMSCLEAR_READ_ONLY: "1"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
    defaults:
      run:
        working-directory: customs-clear/backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare private document directory
        id: prepare
        run: |
          umask 077
          ETT_LEGAL_ROOT="$RUNNER_TEMP/ett-legal-documents"
          mkdir -m 700 "$ETT_LEGAL_ROOT" "$ETT_LEGAL_ROOT/store"
          printf 'ETT_LEGAL_ROOT=%s\n' "$ETT_LEGAL_ROOT" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install source capture dependencies
        id: install
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture current index and observed tariff notes
        id: inputs
        run: |
          python scripts/capture_ett_legal_inputs.py \
            --store-root "$ETT_LEGAL_ROOT/store" --output-directory "$ETT_LEGAL_ROOT/inputs"
      - name: Follow observed tariff search pages
        id: pages
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          python scripts/capture_ett_portal_search.py \
            --store-root "$ETT_LEGAL_ROOT/store" --output "$ETT_LEGAL_ROOT/pagination.json"
      - name: Capture missing index act number queries
        id: supplement
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          python scripts/probe_ett_portal_search.py \
            --query-set missing_index_acts --store-root "$ETT_LEGAL_ROOT/store" \
            --output "$ETT_LEGAL_ROOT/missing-queries.json"
      - name: Reconcile source-bound identities and generate observed capture plan
        id: discovery
        if: ${{ always() && steps.inputs.outcome == 'success' && steps.pages.outcome == 'success' && steps.supplement.outcome == 'success' }}
        run: |
          python scripts/audit_ett_discovery.py \
            --index "$ETT_LEGAL_ROOT/inputs/index.html" \
            --inventory "$ETT_LEGAL_ROOT/inputs/inventory.json" \
            --notes "$ETT_LEGAL_ROOT/inputs/notes.json" \
            --pagination "$ETT_LEGAL_ROOT/pagination.json" \
            --supplementary "$ETT_LEGAL_ROOT/missing-queries.json" \
            --store-root "$ETT_LEGAL_ROOT/store" --output "$ETT_LEGAL_ROOT/discovery.json"
      - name: Capture exact observed legal pages and PDF attachments
        if: ${{ always() && steps.discovery.outcome == 'success' }}
        run: |
          python scripts/capture_ett_legal_documents.py \
            --discovery-report "$ETT_LEGAL_ROOT/discovery.json" \
            --store-root "$ETT_LEGAL_ROOT/store" --output "$ETT_LEGAL_ROOT/legal-documents.json"
      - name: Package retained sources and input reports
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: tar -C "$ETT_LEGAL_ROOT" -czf "$ETT_LEGAL_ROOT/objects.tar.gz" store
      - name: Upload temporary legal evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ett-legal-documents-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ett-legal-documents/inputs/inputs.json
            ${{ runner.temp }}/ett-legal-documents/pagination.json
            ${{ runner.temp }}/ett-legal-documents/missing-queries.json
            ${{ runner.temp }}/ett-legal-documents/discovery.json
            ${{ runner.temp }}/ett-legal-documents/legal-documents.json
            ${{ runner.temp }}/ett-legal-documents/objects.tar.gz
          if-no-files-found: error
          retention-days: 90
