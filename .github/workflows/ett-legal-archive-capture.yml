name: ETT observed legal archive capture

on:
  push:
    branches: [ops/ett-legal-archive-capture]

permissions:
  contents: read

concurrency:
  group: ett-legal-archive-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUSTOMSCLEAR_READ_ONLY: "1"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
    defaults:
      run:
        working-directory: customs-clear/backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare private archive directory
        id: prepare
        run: |
          umask 077
          ETT_ARCHIVE_ROOT="$RUNNER_TEMP/ett-legal-archives"
          mkdir -m 700 "$ETT_ARCHIVE_ROOT" "$ETT_ARCHIVE_ROOT/store"
          printf 'ETT_ARCHIVE_ROOT=%s\n' "$ETT_ARCHIVE_ROOT" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install source capture dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture the two observed Russian archives
        run: |
          python scripts/probe_ett_legal_archives.py \
            --store-root "$ETT_ARCHIVE_ROOT/store" --output "$ETT_ARCHIVE_ROOT/report.json"
      - name: Package original archives and inspected document candidates
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: tar -C "$ETT_ARCHIVE_ROOT" -czf "$ETT_ARCHIVE_ROOT/objects.tar.gz" store
      - name: Upload temporary archive evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ett-legal-archives-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ett-legal-archives/report.json
            ${{ runner.temp }}/ett-legal-archives/objects.tar.gz
          if-no-files-found: error
          retention-days: 90
