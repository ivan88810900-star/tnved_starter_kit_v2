name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Scheduled workflow and locked environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: customs-clear/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject tracked browser session state
        run: |
          tracked_session_files="$(
            git ls-files -- ':(top)customs-clear/backend/data/alta_session/**'
          )"
          if [[ -n "$tracked_session_files" ]]; then
            echo "Browser session state must never be tracked:" >&2
            echo "$tracked_session_files" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements-monitor.txt

      - name: Install exact scheduled-monitor environment
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement requirements-monitor.txt
          python -m pip check

      - name: Validate scheduled workflow contracts
        run: |
          python scripts/validate_scheduled_workflow_contract.py
          python scripts/run_regulatory_source_updates.py \
            --plan --strict --output /tmp/regulatory-source-update-plan.json
          python scripts/build_ntm_full_catalog_baseline.py --check-sources-only

  backend-ntm:
    name: Backend NTM safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: customs-clear/backend
    env:
      DATABASE_URL: sqlite:////tmp/customs-clear-ci.db
      SECRET_KEY: ci-only-secret-key-not-valid-outside-github-actions
      ADMIN_PASSWORD: test-admin-password
      VIEWER_PASSWORD: test-viewer-password
      DECLARANT_PASSWORD: test-declarant-password
      ADMIN_API_TOKEN: ci-only-admin-api-token
      CUSTOMSCLEAR_READ_ONLY: "0"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
      NTM_V2_MEASURES_ENFORCEMENT_ENABLED: "0"
      NTM_V2_RULES_ENFORCEMENT_ENABLED: "0"
      NTM_V2_OFFICIAL_CURATED_ENFORCEMENT_ENABLED: "0"
      NTM_V2_EXACT_TRADE_CURATED_ALLOWLIST_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run focused NTM and enforcement-boundary tests
        run: >-
          python -m pytest -q
          tests/test_non_tariff_rule_validity.py
          tests/test_ntm_layers_legal_guards.py
          tests/test_ntm_v2_advisory_requirements.py
          tests/test_ntm_v2_measures_enforcement.py
          tests/test_ntm_v2_rules_enforcement.py
          tests/test_ntm_v2_source_isolation.py
          tests/test_official_ntm_contours.py
          tests/test_ntm_applicability_schema.py
          tests/test_official_ntm_exact_*.py
          tests/test_official_ntm_curated_enforcement.py
          tests/test_regulatory_source_updates.py
          tests/test_regulatory_adapter_scripts.py
          tests/test_regulatory_adapter_write_guard.py
          tests/test_regulatory_review_queue.py
          tests/test_regulatory_scheduler_api.py
          tests/test_regulatory_snapshot_atomicity.py
          tests/test_opendata_source_integrity.py
          tests/test_opendata_version_guards.py
          tests/test_sgr_state_source_hardening.py
          tests/test_legacy_automation_guards.py
          tests/test_official_source_monitor.py
          tests/test_regulatory_source_completeness.py
          tests/test_data_refresh.py
          tests/test_build_full_staging_snapshot.py
          tests/test_normative_bundle_exact_rate_scope.py
          tests/test_ntm_catalog_baseline.py
          tests/test_run_e2e_scenarios.py
          tests/test_payment_data_coverage.py
          tests/test_cbr_exchange_rate_hardening.py
          tests/test_source_resource_limits.py
          tests/test_safe_fsa_archive.py
          tests/test_payment_registry_references.py
          tests/test_trois_is_active.py
          tests/test_normative_requirements_block.py
          tests/test_sanctions_risk_block.py
          tests/test_semantic_navigation_2204_pdo.py
          tests/test_diagnose_guided_tnved_navigation_catalog.py
          tests/test_api_integration.py::ApiIntegrationTests::test_export_compliance_skips_import_payment_and_antidumping

      - name: Confirm quarantined ETT blocks a positive staging snapshot
        run: |
          staging_snapshot="$RUNNER_TEMP/customs-clear-full-staging.db"
          readiness_report="$RUNNER_TEMP/customs-clear-staging-input-readiness.json"
          untouched_database="$RUNNER_TEMP/customs-clear-builder-must-not-touch.db"
          set +e
          python scripts/build_full_staging_snapshot.py \
            --check-inputs --report "$readiness_report"
          readiness_status=$?
          set -e
          test "$readiness_status" -eq 1
          python - "$readiness_report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["positive_snapshot_allowed"] is False
          assert report["baseline_contract"] == {
              "schema_version": "1",
              "validation_mode": "quarantine_only",
              "positive_validation_implemented": False,
          }
          assert report["ett"]["invalid_code_rows"] == 2
          assert report["ett"]["duplicate_rows"] == 27
          assert report["ett"]["duplicate_code_count"] == 23
          assert report["ett"]["material_conflict_code_count"] == 18
          assert report["ett"]["structurally_publishable"] is False
          assert report["release_gate"]["current_official_ett_verified"] is False
          assert report["release_gate"]["temporal_footnotes_verified"] is False
          PY

          test ! -e "$untouched_database"
          set +e
          DATABASE_URL="sqlite:///$untouched_database" \
            python scripts/build_full_staging_snapshot.py "$staging_snapshot" \
            > "$RUNNER_TEMP/customs-clear-staging-quarantine.log" 2>&1
          build_status=$?
          set -e
          test "$build_status" -ne 0
          grep --quiet "positive staging snapshot blocked" \
            "$RUNNER_TEMP/customs-clear-staging-quarantine.log"
          test ! -e "$staging_snapshot"
          test ! -e "$untouched_database"

  frontend:
    name: Frontend tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: customs-clear/frontend
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customs-clear/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  staging-definition:
    name: Validate and build local staging images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_DATABASE_PATH: /tmp/customs-clear-ci.db
      STAGING_SECRET_KEY: ci-only-secret-key-not-valid-outside-github-actions
      STAGING_ADMIN_PASSWORD: ci-only-admin-password
      STAGING_VIEWER_PASSWORD: ci-only-viewer-password
      STAGING_DECLARANT_PASSWORD: ci-only-declarant-password
      STAGING_ADMIN_API_TOKEN: ci-only-admin-api-token
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render Compose configuration
        working-directory: customs-clear
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Build staging images
        working-directory: customs-clear
        run: docker compose -f docker-compose.staging.yml build

      - name: Create read-only smoke database
        run: >-
          python3 -c
          "import sqlite3;
          db=sqlite3.connect('/tmp/customs-clear-ci.db');
          db.execute('CREATE TABLE smoke_marker (id INTEGER PRIMARY KEY)');
          db.commit();
          db.close()"

      - name: Confirm full-catalog gate rejects the smoke database
        working-directory: customs-clear
        run: |
          chmod 0444 /tmp/customs-clear-ci.db
          set +e
          docker compose -f docker-compose.staging.yml run --rm --no-deps backend \
            python /workspace/customs-clear/staging/prepare_database.py \
            --validate-only /data/customs.db > /tmp/schema-gate.log 2>&1
          schema_status=$?
          set -e
          cat /tmp/schema-gate.log
          if [ "$schema_status" -eq 0 ]; then
            echo "Schema/catalog validation unexpectedly accepted the lightweight database" >&2
            exit 1
          fi
          grep --quiet "missing tables" /tmp/schema-gate.log

          set +e
          docker compose -f docker-compose.staging.yml run --rm --no-deps backend \
            python scripts/run_ntm_full_coverage_audit.py --database /data/customs.db \
            > /tmp/ntm-gate.log 2>&1
          audit_status=$?
          set -e
          cat /tmp/ntm-gate.log
          if [ "$audit_status" -eq 0 ]; then
            echo "Full-catalog audit unexpectedly accepted the lightweight database" >&2
            exit 1
          fi
          grep --quiet '"catalog_complete": false' /tmp/ntm-gate.log
          grep --quiet "no such table: tnved_sections" /tmp/ntm-gate.log

      - name: Start read-only smoke stack
        working-directory: customs-clear
        run: >-
          docker compose
          -f docker-compose.staging.yml
          -f staging/ci-smoke.override.yml
          up --detach --wait

      - name: Smoke backend and frontend proxy
        run: |
          curl --fail --show-error http://127.0.0.1:8001/api/health/ready
          curl --fail --show-error http://127.0.0.1:3000/api/health/ready

      - name: Show staging logs on failure
        if: failure()
        working-directory: customs-clear
        run: >-
          docker compose
          -f docker-compose.staging.yml
          -f staging/ci-smoke.override.yml
          logs --no-color

      - name: Stop smoke stack
        if: always()
        working-directory: customs-clear
        run: >-
          docker compose
          -f docker-compose.staging.yml
          -f staging/ci-smoke.override.yml
          down --remove-orphans
