name: ETT observed legal source review

on:
  push:
    branches: [ops/ett-observed-legal-source]

permissions:
  contents: read

concurrency:
  group: ett-observed-legal-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUSTOMSCLEAR_READ_ONLY: "1"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
    defaults:
      run:
        working-directory: customs-clear/backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare private evidence directory
        id: prepare
        run: |
          umask 077
          ETT_REVIEW_ROOT="$RUNNER_TEMP/ett-observed-legal-source"
          mkdir -m 700 "$ETT_REVIEW_ROOT" "$ETT_REVIEW_ROOT/store"
          printf 'ETT_REVIEW_ROOT=%s\n' "$ETT_REVIEW_ROOT" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install source capture dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture observed detail page and original PDF
        run: |
          python scripts/probe_ett_legal_sources.py \
            --store-root "$ETT_REVIEW_ROOT/store" --output "$ETT_REVIEW_ROOT/review.json" \
            --source-id observed_collegium_42_review_page \
            --source-id observed_collegium_42_review_pdf
      - name: Package retained source bytes
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: tar -C "$ETT_REVIEW_ROOT" -czf "$ETT_REVIEW_ROOT/objects.tar.gz" store
      - name: Upload source review evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ett-observed-legal-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ett-observed-legal-source/review.json
            ${{ runner.temp }}/ett-observed-legal-source/objects.tar.gz
          if-no-files-found: error
          retention-days: 90
