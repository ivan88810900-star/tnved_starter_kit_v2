name: ETT observed tariff relief originals

on:
  push:
    branches: [ops/ett-tariff-relief-capture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ett-tariff-relief-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relief-capture:
    if: github.ref == 'refs/heads/ops/ett-tariff-relief-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUSTOMSCLEAR_READ_ONLY: "1"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
    defaults:
      run:
        working-directory: customs-clear/backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare private original capture directory
        id: prepare
        run: |
          umask 077
          ETT_RELIEF_ROOT="$RUNNER_TEMP/ett-tariff-relief"
          mkdir -m 700 "$ETT_RELIEF_ROOT" "$ETT_RELIEF_ROOT/store"
          printf 'ETT_RELIEF_ROOT=%s\n' "$ETT_RELIEF_ROOT" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install source capture dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture observed pages and directly linked originals
        run: |
          python scripts/capture_ett_tariff_relief.py \
            --store-root "$ETT_RELIEF_ROOT/store" --output "$ETT_RELIEF_ROOT/report.json" \
            --detail-url https://docs.eaeunion.org/documents/461/10843/ \
            --detail-url https://docs.eaeunion.org/documents/461/10846/ \
            --detail-url https://docs.eaeunion.org/documents/461/10848/ \
            --detail-url https://docs.eaeunion.org/documents/461/10854/
      - name: Package original source objects
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: tar -C "$ETT_RELIEF_ROOT" -czf "$ETT_RELIEF_ROOT/objects.tar.gz" store
      - name: Upload temporary original evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ett-tariff-relief-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ett-tariff-relief/report.json
            ${{ runner.temp }}/ett-tariff-relief/objects.tar.gz
          if-no-files-found: error
          retention-days: 90
