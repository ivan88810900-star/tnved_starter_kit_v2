name: Tariff trusted A6 live audit
run-name: Tariff A6 command ${{ github.event.comment.body }}

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: tariff-a6-live-pending-request
  cancel-in-progress: false

jobs:
  context-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      delivery-generation: ${{ steps.resolve.outputs.delivery_generation }}
    steps:
      - name: Require exact owner command on recovery issue
        env:
          A6_EVENT_NAME: ${{ github.event_name }}
          A6_EVENT_ACTION: ${{ github.event.action }}
          A6_ISSUE_NUMBER: ${{ github.event.issue.number }}
          A6_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          A6_COMMENT_BODY: ${{ github.event.comment.body }}
          A6_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          A6_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          A6_ACTOR: ${{ github.actor }}
          A6_REPOSITORY_OWNER: ${{ github.repository_owner }}
          A6_ACTUAL_REF: ${{ github.ref }}
          A6_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
          A6_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$A6_EVENT_NAME" = issue_comment
          test "$A6_EVENT_ACTION" = created
          test "$A6_ISSUE_NUMBER" = 214
          test "$A6_IS_PULL_REQUEST" = false
          test "$A6_COMMENT_BODY" = '/tariff-a6-live run-pending'
          test "$A6_COMMENT_AUTHOR" = "$A6_REPOSITORY_OWNER"
          test "$A6_AUTHOR_ASSOCIATION" = OWNER
          test "$A6_ACTOR" = "$A6_REPOSITORY_OWNER"
          test "$A6_ACTUAL_REF" = "$A6_EXPECTED_REF"
          test "$A6_RUN_ATTEMPT" = 1

      - name: Checkout only trusted default-branch workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact trusted workflow checkout
        env:
          A6_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          [[ "$A6_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$A6_WORKFLOW_SHA"

      - name: Checkout authoritative state as inert data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/orchestration-state
          path: .a6-state
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable pending request before credentials
        id: resolve
        env:
          A6_STATE_ROOT: ${{ github.workspace }}/.a6-state
          A6_STATUS_PATH: ${{ github.workspace }}/.a6-state/.ai/orchestration/A6_LIVE_STATUS.json
          A6_LEASE_PATH: ${{ github.workspace }}/.a6-state/.ai/COORDINATOR_LEASE.json
        run: |
          python3 -m tools.tariff_agents.audit_bridge --repo . resolve-pending \
            --output "$RUNNER_TEMP/a6-request.json"
          python3 - <<'PY'
          import json
          import os

          request = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                                "a6-request.json"), encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"delivery_generation={request['delivery_generation']}\n")
          PY

      - name: Reject duplicate delivery of this pending request before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          A6_API_URL: ${{ github.api_url }}
          A6_REPOSITORY: ${{ github.repository }}
          A6_REPOSITORY_OWNER: ${{ github.repository_owner }}
          A6_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -m tools.tariff_agents.audit_bridge --repo . dedupe-delivery \
            --request "$RUNNER_TEMP/a6-request.json"

  live-audit:
    needs: context-gate
    environment: tariff-a6-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted default-branch bridge only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout authoritative state as inert data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/orchestration-state
          path: .a6-state
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable pending request and lawful A0 lease
        id: resolve
        env:
          A6_STATE_ROOT: ${{ github.workspace }}/.a6-state
          A6_STATUS_PATH: ${{ github.workspace }}/.a6-state/.ai/orchestration/A6_LIVE_STATUS.json
          A6_LEASE_PATH: ${{ github.workspace }}/.a6-state/.ai/COORDINATOR_LEASE.json
        run: |
          python3 -m tools.tariff_agents.audit_bridge --repo . resolve-pending \
            --output "$RUNNER_TEMP/a6-request.json"

      - name: Verify request generation selected by precredential gate
        env:
          A6_EXPECTED_GENERATION: ${{ needs.context-gate.outputs.delivery-generation }}
        run: |
          python3 - <<'PY'
          import json
          import os

          request = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                                "a6-request.json"), encoding="utf-8"))
          if request["delivery_generation"] != os.environ["A6_EXPECTED_GENERATION"]:
              raise SystemExit("A6 pending request changed after context gate")
          PY

      - name: Build packet from resolved request without provider credentials
        env:
          A6_STATE_ROOT: ${{ github.workspace }}/.a6-state
          A6_STATUS_PATH: ${{ github.workspace }}/.a6-state/.ai/orchestration/A6_LIVE_STATUS.json
          A6_LEASE_PATH: ${{ github.workspace }}/.a6-state/.ai/COORDINATOR_LEASE.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          request = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                                "a6-request.json"), encoding="utf-8"))
          subprocess.run([
              "python3", "-m", "tools.tariff_agents.audit_bridge", "--repo", ".",
              "prepare", "--request-id", request["request_id"],
              "--base", request["base_sha"], "--head", request["head_sha"],
              "--contract", request["contract_sha"],
              "--paths-json", request["paths_json"],
              "--sources-json", request["official_sources_json"],
              "--output", os.path.join(os.environ["RUNNER_TEMP"], "a6-packet.json"),
          ], check=True)
          PY

      - name: Invoke checked adapter once with A6 credentials
        id: live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARIFF_ANTHROPIC_MODEL: ${{ vars.TARIFF_ANTHROPIC_MODEL }}
          A6_STATE_ROOT: ${{ github.workspace }}/.a6-state
          A6_STATUS_PATH: ${{ github.workspace }}/.a6-state/.ai/orchestration/A6_LIVE_STATUS.json
          A6_LEASE_PATH: ${{ github.workspace }}/.a6-state/.ai/COORDINATOR_LEASE.json
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          import subprocess

          request = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],
                                                "a6-request.json"), encoding="utf-8"))
          completed = subprocess.run([
              "python3", "-m", "tools.tariff_agents.audit_bridge", "--repo", ".",
              "run", "--request-id", request["request_id"],
              "--base", request["base_sha"], "--head", request["head_sha"],
              "--contract", request["contract_sha"],
              "--packet", os.path.join(os.environ["RUNNER_TEMP"], "a6-packet.json"),
              "--receipt", os.path.join(os.environ["RUNNER_TEMP"], "a6-receipt.json"),
          ], check=False)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"code={completed.returncode}\n")
          PY
          exit 0

      - name: Upload scrubbed commit-bound receipt and findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tariff-a6-live-${{ github.run_id }}
          path: ${{ runner.temp }}/a6-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fail-closed live result
        if: always()
        env:
          A6_EXIT_CODE: ${{ steps.live.outputs.code }}
        run: |
          test "$A6_EXIT_CODE" = 0
