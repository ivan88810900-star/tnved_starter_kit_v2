name: ETT observed Council amendment originals

on:
  push:
    branches: [ops/ett-council-list-capture]

permissions:
  contents: read

concurrency:
  group: ett-council-list-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  council-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUSTOMSCLEAR_READ_ONLY: "1"
      SCHEDULER_ENABLED: "0"
      REGULATORY_SYNC_SCHEDULER_ENABLED: "0"
    defaults:
      run:
        working-directory: customs-clear/backend
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare private source directory
        id: prepare
        run: |
          umask 077
          ETT_COUNCIL_ROOT="$RUNNER_TEMP/ett-council-list"
          mkdir -m 700 "$ETT_COUNCIL_ROOT" "$ETT_COUNCIL_ROOT/store"
          printf 'ETT_COUNCIL_ROOT=%s\n' "$ETT_COUNCIL_ROOT" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install source capture dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture observed year listing and selected original documents
        run: |
          umask 077
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime
          from pathlib import Path

          from app.services.ett_artifacts import LocalArtifactStore
          from app.services.ett_council_listing import capture_council_listing
          from app.services.ett_tariff_relief_capture import capture_tariff_relief, selected_details

          def encode(value):
              if type(value) in (date, datetime):
                  return value.isoformat()
              raise TypeError("unsupported report value")

          def save(path, value):
              with path.open("x", encoding="utf-8") as target:
                  json.dump(value, target, ensure_ascii=False, sort_keys=True,
                            indent=2, allow_nan=False, default=encode)
                  target.write("\n")

          root = Path(os.environ["ETT_COUNCIL_ROOT"])
          store = LocalArtifactStore(root / "store")
          listing = capture_council_listing(store)
          save(root / "listing.json", listing)
          if listing["selected_target_urls_observed"] is not True:
              raise SystemExit("Selected Council originals remain unobserved; retained listing explains the gap")
          # Use exact links from this in-process parsed original graph. No shell
          # interpolation of source text, report replay shortcut or guessed IDs.
          details = selected_details(tuple(row["document_link"]["url"] for row in listing["candidates"]))
          originals = capture_tariff_relief(store, detail_urls=details)
          save(root / "originals.json", originals)
          if originals["capture_complete"] is not True:
              raise SystemExit("Selected original capture incomplete; no legal approval or rate activation")
          PY
      - name: Package source objects
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: tar -C "$ETT_COUNCIL_ROOT" -czf "$ETT_COUNCIL_ROOT/objects.tar.gz" store
      - name: Upload temporary source evidence
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ett-council-originals-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ett-council-list/listing.json
            ${{ runner.temp }}/ett-council-list/originals.json
            ${{ runner.temp }}/ett-council-list/objects.tar.gz
          if-no-files-found: error
          retention-days: 90
