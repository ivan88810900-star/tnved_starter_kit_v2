name: Tariff agent safety
on:
  pull_request:
    branches: [main, feat/canonical-read-path]
    paths: ['tools/tariff_agents/**', 'tests/agent_orchestration/**', '.ai/**', 'AGENTS.md', '.github/workflows/tariff-agent-safety.yml', '.github/workflows/tariff-a6-live.yml']
  push:
    branches: ['agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tariff-agent-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Deterministic control and adapter tests (no credentials)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m tools.tariff_agents.verify
          python3 -m unittest -v tests.agent_orchestration.test_cli_snapshot
      - name: Committed persistent state schema
        run: python3 -m tools.tariff_agents validate-snapshot
  payment-regression:
    if: ${{ startsWith(github.ref, 'refs/heads/agent/core-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: customs-clear/backend
    env:
      DATABASE_URL: sqlite:////tmp/customs-clear-payment-ci.db
      SECRET_KEY: ci-payment-regression-only
      SCHEDULER_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Bootstrap committed payment fixture
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          from app.db import SessionLocal
          from app.models.core import HsRate
          from app.services.normative_store import init_db

          init_db()
          payload = json.loads(
              Path("data/raw_normative/eec_ett_vat.json").read_text(encoding="utf-8")
          )
          rates_by_code = {}
          for item in payload.get("rates", []):
              code = re.sub(r"\D", "", str(item.get("hs_code") or ""))
              if len(code) == 10:
                  rates_by_code[code] = item
          if not rates_by_code:
              raise SystemExit("committed VAT snapshot has no 10-digit rows")

          with SessionLocal() as db:
              existing_codes = {row[0] for row in db.query(HsRate.hs_code).all()}

          rows = []
          for code, item in rates_by_code.items():
              if code in existing_codes:
                  continue
              raw_rate = item.get("vat_import_rate")
              rows.append(
                  HsRate(
                      hs_code=code,
                      hs_prefix=code,
                      duty_rate="0",
                      vat_import_rate=22.0 if raw_rate is None else float(raw_rate),
                      vat_rule=str(item.get("vat_rule") or "none"),
                      vat_rule_basis=str(item.get("vat_rule_basis") or ""),
                      source_revision="ci-committed-vat-snapshot",
                  )
              )
          with SessionLocal() as db:
              db.bulk_save_objects(rows)
              db.commit()
          print(f"seeded {len(rows)} committed VAT rows")
          PY
          python scripts/import_vat_preferences.py data/vat_preferences_pp908_expansion.json
      - name: Run payment regression slice
        run: >-
          python -m pytest -q
          tests/test_pp908_vat_coverage.py
          tests/test_import_duty_ingestion.py
          tests/test_official_bundle_builder_safety.py
          tests/test_payment_engine.py
          tests/test_special_duties.py
          tests/test_api_integration.py
          tests/test_hs_leaf_clarification.py
          tests/test_recycling_fees.py
          tests/test_tariff_preferences.py
