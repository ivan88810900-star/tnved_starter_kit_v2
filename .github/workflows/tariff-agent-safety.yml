name: Tariff agent safety
on:
  pull_request:
    branches: [main, feat/canonical-read-path]
    paths: ['tools/tariff_agents/**', 'tests/agent_orchestration/**', '.ai/**', 'AGENTS.md', '.github/workflows/tariff-agent-safety.yml', '.github/workflows/tariff-a6-live.yml']
  push:
    branches: ['agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tariff-agent-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Deterministic control and adapter tests (no credentials)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m tools.tariff_agents.verify
          python3 -m unittest -v tests.agent_orchestration.test_cli_snapshot
      - name: Committed persistent state schema
        run: python3 -m tools.tariff_agents validate-snapshot
  payment-regression:
    if: ${{ startsWith(github.ref, 'refs/heads/agent/core-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: customs-clear/backend
    env:
      DATABASE_URL: sqlite:////tmp/customs-clear-payment-ci.db
      SECRET_KEY: ci-payment-regression-only
      SCHEDULER_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: customs-clear/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run payment regression slice
        run: >-
          python -m pytest -q
          tests/test_pp908_vat_coverage.py
          tests/test_import_duty_ingestion.py
          tests/test_official_bundle_builder_safety.py
          tests/test_payment_engine.py
          tests/test_special_duties.py
