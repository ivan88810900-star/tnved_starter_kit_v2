name: Tariff agent safety
on:
  pull_request:
    branches: [main, feat/canonical-read-path]
    paths: ['tools/tariff_agents/**', 'tests/agent_orchestration/**', 'customs-clear/backend/tests/test_tnved_catalog_api.py', 'customs-clear/backend/tests/test_tnved_recovery_http.py', 'customs-clear/backend/tests/test_tnved_fidelity.py', 'customs-clear/backend/tests/test_tnved_presentation.py', 'customs-clear/backend/app/services/tnved_presentation.py', 'customs-clear/backend/scripts/build_tnved_presentation.py', 'customs-clear/backend/scripts/audit_tnved_presentation.py', 'customs-clear/backend/data/tnved_presentation_spacing.json', 'customs-clear/frontend/scripts/presentation-browser-check.cjs', 'customs-clear/backend/app/services/tnved_fidelity.py', 'customs-clear/backend/scripts/build_tnved_fidelity.py', 'customs-clear/backend/scripts/audit_tnved_official.py', 'customs-clear/frontend/src/components/TnvedAccordionTree.tsx', 'customs-clear/frontend/scripts/fidelity-browser-check.cjs', 'customs-clear/backend/app/api/tnved_recovery.py', 'customs-clear/backend/app/recovery_main.py', 'customs-clear/backend/app/services/tnved_recovery_store.py', 'customs-clear/frontend/src/api/tnvedCatalog.ts', 'customs-clear/frontend/src/context/ClientCapabilitiesContext.tsx', 'customs-clear/frontend/src/pages/Dictionary.tsx', 'customs-clear/frontend/src/components/tnved/RecoveredCodeDetails.tsx', 'customs-clear/frontend/scripts/recovery-browser-check.cjs', 'customs-clear/backend/app/api/tnved.py', 'customs-clear/backend/app/api/tnved_catalog.py', 'customs-clear/backend/app/db.py', 'customs-clear/backend/app/models/__init__.py', 'customs-clear/backend/app/models/tnved.py', 'customs-clear/backend/app/services/hs_matching.py', 'customs-clear/backend/app/services/normative_store.py', 'customs-clear/backend/app/services/tnved_fts.py', 'customs-clear/backend/app/services/tnved_tree/**', '.ai/**', 'AGENTS.md', '.github/workflows/tariff-agent-safety.yml', '.github/workflows/tariff-a6-live.yml']
  push:
    branches: ['agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tariff-agent-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
      - name: Deterministic control and adapter tests (no credentials)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m tools.tariff_agents.verify
          python3 -m unittest discover -s tests/agent_orchestration -v
          python3 -m unittest -v tests.agent_orchestration.test_cli_snapshot
      - name: TN VED recovery builder and SQLite tests (synthetic fixture)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: customs-clear/backend
        run: python3 scripts/run_tnved_recovery_ci.py
      - name: Committed persistent state schema
        run: python3 -m tools.tariff_agents validate-snapshot
      - name: Hermetic TN VED API search-to-children traversal
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_NO_CACHE_DIR: '1'
          PIP_NO_INPUT: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: customs-clear/backend
        run: |
          python3 -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 14), sys.version'
          python3 -m venv "${RUNNER_TEMP}/tnved-api-venv"
          "${RUNNER_TEMP}/tnved-api-venv/bin/python" -m pip install --only-binary=:all: \
            alembic==1.20.1 annotated-doc==0.0.3 annotated-types==0.7.0 anyio==4.14.2 \
            certifi==2026.10.18 fastapi==0.162.0 greenlet==3.2.4 \
            Mako==1.4.3 MarkupSafe==3.0.4 \
            h11==0.16.0 httpcore==1.0.9 httpx==0.28.1 idna==3.11 \
            loguru==0.7.3 opentelemetry-api==1.44.0 \
            pydantic==2.14.2 pydantic-core==2.50.2 \
            SQLAlchemy==2.0.44 starlette==1.10.0 \
            typing-extensions==4.16.0 typing-inspection==0.4.4
          "${RUNNER_TEMP}/tnved-api-venv/bin/python" -m unittest -v \
            tests.test_tnved_recovery_http \
            tests.test_tnved_fidelity \
            tests.test_tnved_presentation \
            tests.test_tnved_catalog_api.HermeticTnvedCatalogApiTests

